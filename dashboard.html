<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service Portal | Sahaj Jan Seva Kendra</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>:root{--navy:#071b3b;--blue:#1264e8;--soft:#f6faff;--line:#dbe7f6;--ink:#10213e;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--soft);font:14px/1.5 "DM Sans",sans-serif;color:var(--ink)}header{background:var(--navy);color:white;padding:0 0 27px}.top{height:70px;border-bottom:1px solid #ffffff18}.wrap{width:min(1100px,calc(100% - 40px));margin:auto}.top .wrap{height:100%;display:flex;justify-content:space-between;align-items:center}.brand{font:800 16px Manrope,sans-serif;letter-spacing:.2px}.brand i{display:inline-grid;place-items:center;background:#1b75f2;border-radius:9px;width:29px;height:29px;margin-right:8px}.logout{border:1px solid #7999c8;background:transparent;color:white;border-radius:8px;padding:8px 13px;font-weight:700;cursor:pointer}.welcome{padding-top:27px}.welcome h1{font:800 29px Manrope,sans-serif;margin:0 0 4px}.welcome p{margin:0;color:#c6d9f8}.container{margin:28px auto 55px}.add-card,.table-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 10px 32px #183c7410}.add-card{margin-bottom:20px}.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.card-head h2,.table-card h2{font:800 19px Manrope,sans-serif;margin:0}.muted{color:var(--muted);font-size:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}input,select{width:100%;border:1px solid #cedeef;border-radius:9px;padding:11px 12px;background:#fff;outline:0}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1264e819}.submit{margin-top:13px;border:0;border-radius:9px;padding:12px 16px;background:var(--blue);color:white;font-weight:700;cursor:pointer}.table-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:15px}.search{position:relative;width:min(315px,100%)}.search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#7b8ba2}.search input{padding-left:35px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:610px}th{text-align:left;color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:1px;padding:12px;border-bottom:1px solid var(--line)}td{padding:14px 12px;border-bottom:1px solid #ebf1f9;font-size:13px}.badge{padding:5px 9px;border-radius:20px;font-weight:700;font-size:11px;white-space:nowrap}.pending{background:#fff2da;color:#9a5600}.completed{background:#dff8ed;color:#10704c}.process{background:#e4f0ff;color:#075bbb}.empty{text-align:center;color:var(--muted);padding:25px}@media(max-width:700px){.wrap{width:min(100% - 28px,1100px)}.form-grid{grid-template-columns:1fr}.add-card,.table-card{padding:19px}.welcome h1{font-size:24px}}</style></head><body><header><div class="top"><div class="wrap"><div class="brand"><i class="fa-solid fa-s"></i> SAHAJ JAN SEVA KENDRA</div><button class="logout" onclick="logout()">Logout <i class="fa-solid fa-arrow-right-from-bracket"></i></button></div></div><div class="wrap welcome"><h1 id="title">Service requests</h1><p id="userRoleText">Loading your access…</p></div></header><main class="wrap container"><section class="add-card" id="addRequestSection"><div class="card-head"><div><h2>Add new request</h2><span class="muted">Create a request for a customer at the centre.</span></div></div><form onsubmit="event.preventDefault();addNewRequest()"><div class="form-grid"><input id="reqName" required placeholder="Customer name"><input id="reqMobile" type="tel" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" required placeholder="10-digit mobile number"><select id="reqService"><option>Aadhaar Service</option><option>New PAN Card</option><option>PAN Correction</option><option>Income Certificate</option><option>Caste Certificate</option><option>Domicile Certificate</option><option>AEPS Banking</option><option>Scholarship Form</option><option>Laptop / Computer Repair</option><option selected>Other Service</option></select></div><button class="submit">Add request <i class="fa-solid fa-plus"></i></button></form></section><section class="table-card"><div class="table-head"><div><h2 id="tableHeading">All requests</h2><span class="muted">Search requests by customer, mobile, service or status.</span></div><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" placeholder="Search requests" oninput="filterRequests()"></div></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Mobile</th><th>Service</th><th>Date</th><th>Status</th></tr></thead><tbody id="requestTableBody"></tbody></table><div id="noDataMsg" class="empty" style="display:none">No requests found.</div></div></section></main><script>let requests=JSON.parse(localStorage.getItem('sjsk_requests'))||[{name:'bhupendra kumar',mobile:'8006705605',service:'Other Service',date:'2026-07-25',status:'Pending'},{name:'Gaurav Chaudhary',mobile:'8954214200',service:'PAN Correction',date:'2026-07-24',status:'Completed'},{name:'Rahul Sharma',mobile:'9876543210',service:'Aadhaar Service',date:'2026-07-23',status:'In Process'}];const role=sessionStorage.getItem('sjsk_role'),custMobile=sessionStorage.getItem('sjsk_mobile')||'';addEventListener('DOMContentLoaded',()=>{if(!role){location.href='login.html';return}if(role==='staff'){userRoleText.textContent='Staff portal · manage customer requests'}else{title.textContent='My service requests';userRoleText.textContent='Customer portal · '+custMobile;addRequestSection.style.display='none';tableHeading.textContent='My requests'}renderRequests()});function renderRequests(data=null){let list=data||requests;if(role==='customer')list=list.filter(r=>r.mobile===custMobile);requestTableBody.innerHTML='';noDataMsg.style.display=list.length?'none':'block';list.forEach(r=>{let c=r.status==='Completed'?'completed':r.status==='In Process'?'process':'pending',tr=document.createElement('tr');tr.innerHTML=`<td><strong>${escapeHtml(r.name)}</strong></td><td>${escapeHtml(r.mobile)}</td><td>${escapeHtml(r.service)}</td><td>${escapeHtml(r.date)}</td><td><span class="badge ${c}">${escapeHtml(r.status)}</span></td>`;requestTableBody.appendChild(tr)})}function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function filterRequests(){let q=searchInput.value.toLowerCase().trim();renderRequests(requests.filter(r=>[r.name,r.mobile,r.service,r.status].some(x=>x.toLowerCase().includes(q))))}function addNewRequest(){let name=reqName.value.trim(),mobile=reqMobile.value.trim();if(!/^\d{10}$/.test(mobile)){alert('Enter a valid 10-digit mobile number.');return}requests.unshift({name,mobile,service:reqService.value,date:new Date().toISOString().split('T')[0],status:'Pending'});localStorage.setItem('sjsk_requests',JSON.stringify(requests));reqName.value='';reqMobile.value='';renderRequests()}function logout(){sessionStorage.clear();location.href='login.html'}</script></body></html>

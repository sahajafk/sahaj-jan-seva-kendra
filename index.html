<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<title>Sahaj Jan Seva Kendra</title>

<style>*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:#f5f7fa;
color:#333;
}

header{
background:linear-gradient(135deg,#0f5132,#198754);
color:white;
padding:80px 20px;
text-align:center;
}

header h1{
font-size:3rem;
margin-bottom:10px;
}

header p{
font-size:1.1rem;
margin:5px 0;
}

.hero-btn{
display:inline-block;
margin-top:20px;
padding:12px 25px;
background:#fff;
color:#198754;
font-weight:600;
border-radius:30px;
text-decoration:none;
}

nav{
background:white;
padding:15px;
position:sticky;
top:0;
z-index:999;
box-shadow:0 2px 15px rgba(0,0,0,.1);
text-align:center;
}

nav a{
margin:0 15px;
text-decoration:none;
color:#198754;
font-weight:600;
}

section{
max-width:1200px;
margin:25px auto;
padding:30px;
background:white;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h2{
color:#198754;
margin-bottom:20px;
}

.hero-image{
width:100%;
border-radius:15px;
margin-top:25px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-top:20px;
}

.stat-card{
background:#198754;
color:white;
padding:25px;
border-radius:15px;
text-align:center;
}

.stat-card h3{
font-size:2rem;
}

.services-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.service-card{
background:#f8f9fa;
padding:20px;
border-radius:12px;
border-left:5px solid #198754;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.gallery img{
width:100%;
height:250px;
object-fit:cover;
border-radius:12px;
}

form input,
form select,
form textarea{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ddd;
border-radius:8px;
}

button{
background:#198754;
color:white;
border:none;
padding:12px 25px;
border-radius:8px;
cursor:pointer;
}

.contact-box{
line-height:2;
font-size:17px;
}

footer{
background:#0f5132;
color:white;
text-align:center;
padding:20px;
margin-top:30px;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px 22px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
box-shadow:0 5px 20px rgba(0,0,0,.3);
}

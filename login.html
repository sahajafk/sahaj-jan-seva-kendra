<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Sahaj Jan Seva Kendra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220; --bg-alt:#111A2E; --surface:rgba(255,255,255,0.06);
  --text:#E2E8F0; --text-muted:#94A3B8;
  --primary:#1E40AF; --primary-dark:#13275C; --primary-light:#3B5FCC;
  --accent:#D97706; --border:rgba(255,255,255,0.1);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 20%, rgba(30,64,175,0.35), transparent 45%),
    radial-gradient(circle at 80% 80%, rgba(217,119,6,0.15), transparent 45%),
    linear-gradient(135deg,#080D18,#0B1220);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}

.glow-wrap{
  position:relative;
  width:100%;max-width:420px;
  border-radius:26px;
  padding:3px;
  overflow:hidden;
  box-shadow:0 25px 70px rgba(0,0,0,.55);
}
.glow-wrap::before{
  content:'';
  position:absolute;
  top:50%;left:50%;
  width:220%;height:220%;
  background:conic-gradient(from 0deg,
    transparent 0deg,
    var(--accent) 40deg,
    #FFD37A 70deg,
    var(--primary-light) 130deg,
    #7FA3FF 160deg,
    transparent 220deg,
    transparent 360deg);
  animation:spin 4s linear infinite;
  z-index:0;
}
@keyframes spin{
  from{transform:translate(-50%,-50%) rotate(0deg);}
  to{transform:translate(-50%,-50%) rotate(360deg);}
}

.card{
  position:relative;z-index:1;
  background:var(--bg-alt);
  border-radius:23px;
  padding:36px 30px;
}
.brand{text-align:center;margin-bottom:22px;}
.brand h1{font-family:'Playfair Display',serif;font-size:22px;color:#fff;}
.brand p{font-size:12px;color:var(--text-muted);margin-top:4px;letter-spacing:1px;text-transform:uppercase;}
.avatar-ring{
  width:64px;height:64px;border-radius:50%;margin:0 auto 14px;
  background:linear-gradient(135deg,var(--primary-light),var(--accent));
  display:flex;align-items:center;justify-content:center;font-size:28px;
}
.tricolor-rule{height:3px;width:50px;background:linear-gradient(90deg,var(--accent),var(--primary-light));border-radius:4px;margin:12px auto 0;}

.tabs{display:flex;background:rgba(255,255,255,0.06);border-radius:12px;padding:5px;margin-bottom:22px;}
.tab-btn{
  flex:1;text-align:center;padding:10px;border:none;background:none;
  border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--text-muted);
  transition:.2s;
}
.tab-btn.active{background:var(--primary);color:#fff;}

.form-panel{display:none;}
.form-panel.active{display:block;}
label{font-size:13px;font-weight:600;color:var(--text);display:block;margin:12px 0 4px;}
input{
  width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;
  font-size:14px;background:rgba(255,255,255,0.05);color:var(--text);
}
input::placeholder{color:var(--text-muted);}
input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.btn{
  width:100%;margin-top:20px;padding:13px;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--primary-light),var(--primary));color:#fff;font-weight:700;font-size:15px;cursor:pointer;
  transition:.2s;
}
.btn:hover{filter:brightness(1.1);}
.hint{
  margin-top:16px;font-size:12px;color:var(--text-muted);
  background:rgba(217,119,6,0.1);border:1px dashed var(--accent);border-radius:8px;padding:10px;
}
.error{color:#FF8080;font-size:13px;margin-top:10px;display:none;}
.back-link{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--text-muted);text-decoration:none;font-weight:600;}
.back-link:hover{color:#fff;}
</style>
</head>
<body>

<div class="glow-wrap">
<div class="card">
  <div class="brand">
    <div class="avatar-ring">🔐</div>
    <h1>SAHAJ JAN SEVA KENDRA</h1>
    <p>Secure Login</p>
    <div class="tricolor-rule"></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="staffTabBtn" onclick="switchTab('staff')">Staff Login</button>
    <button class="tab-btn" id="customerTabBtn" onclick="switchTab('customer')">Customer Login</button>
  </div>

  <!-- STAFF LOGIN -->
  <div class="form-panel active" id="staffPanel">
    <label for="staffUser">Username</label>
    <input type="text" id="staffUser" placeholder="Enter username">
    <label for="staffPass">Password</label>
    <input type="password" id="staffPass" placeholder="Enter password">
    <button class="btn" onclick="staffLogin()">Login as Staff</button>
    <p class="error" id="staffError">Galat username ya password.</p>
    <div class="hint">Demo login — Username: <b>admin</b> &nbsp;Password: <b>admin123</b></div>
  </div>

  <!-- CUSTOMER LOGIN -->
  <div class="form-panel" id="customerPanel">
    <label for="custMobile">Mobile Number</label>
    <input type="tel" id="custMobile" placeholder="Enter your 10-digit mobile number" maxlength="10">
    <button class="btn" onclick="customerLogin()">View My Requests</button>
    <p class="error" id="custError">Ye mobile number kisi request se linked nahi hai.</p>
    <div class="hint">Apna wahi mobile number daalein jo aapne request form mein diya tha.</div>
  </div>

  <a class="back-link" href="index.html">← Back to Website</a>
</div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const initialTab = urlParams.get('tab');
if(initialTab === 'customer'){ window.addEventListener('DOMContentLoaded', () => switchTab('customer')); }

function switchTab(tab){
  document.getElementById('staffPanel').classList.toggle('active', tab==='staff');
  document.getElementById('customerPanel').classList.toggle('active', tab==='customer');
  document.getElementById('staffTabBtn').classList.toggle('active', tab==='staff');
  document.getElementById('customerTabBtn').classList.toggle('active', tab==='customer');
}

function staffLogin(){
  const user = document.getElementById('staffUser').value.trim();
  const pass = document.getElementById('staffPass').value.trim();
  const err = document.getElementById('staffError');
  if(user === 'admin' && pass === 'admin123'){
    sessionStorage.setItem('sjsk_role','staff');
    window.location.href = 'dashboard.html';
  } else {
    err.style.display = 'block';
  }
}

function customerLogin(){
  const mobile = document.getElementById('custMobile').value.trim();
  const err = document.getElementById('custError');
  if(mobile.length === 10 && /^[0-9]+$/.test(mobile)){
    sessionStorage.setItem('sjsk_role','customer');
    sessionStorage.setItem('sjsk_mobile', mobile);
    window.location.href = 'dashboard.html';
  } else {
    err.style.display = 'block';
  }
}
</script>

</body>
</html>

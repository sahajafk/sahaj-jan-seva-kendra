<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Sahaj Jan Seva Kendra Khair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
  --bg:#0B1220; 
  --bg-alt:#111A2E; 
  --surface:rgba(255,255,255,0.06);
  --text:#E2E8F0; 
  --text-muted:#94A3B8;
  --primary:#1E40AF; 
  --primary-dark:#13275C; 
  --primary-light:#3B5FCC;
  --accent:#D97706; 
  --border:rgba(255,255,255,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 20%, rgba(30,64,175,0.35), transparent 45%),
    radial-gradient(circle at 80% 80%, rgba(217,119,6,0.15), transparent 45%),
    linear-gradient(135deg,#080D18,#0B1220);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}

.glow-wrap{
  position:relative;
  width:100%;max-width:420px;
  border-radius:26px;
  padding:3px;
  overflow:hidden;
  box-shadow:0 25px 70px rgba(0,0,0,.65);
}
.glow-wrap::before{
  content:'';
  position:absolute;
  top:50%;left:50%;
  width:220%;height:220%;
  background:conic-gradient(from 0deg,
    transparent 0deg,
    var(--accent) 40deg,
    #FFD37A 70deg,
    var(--primary-light) 130deg,
    #7FA3FF 160deg,
    transparent 220deg,
    transparent 360deg);
  animation:spin 4s linear infinite;
  z-index:0;
}
@keyframes spin{
  from{transform:translate(-50%,-50%) rotate(0deg);}
  to{transform:translate(-50%,-50%) rotate(360deg);}
}

.card{
  position:relative;z-index:1;
  background:var(--bg-alt);
  border-radius:23px;
  padding:36px 30px;
}
.brand{text-align:center;margin-bottom:22px;}
.brand h1{font-family:'Playfair Display',serif;font-size:22px;color:#fff;letter-spacing:0.5px;}
.brand p{font-size:12px;color:var(--text-muted);margin-top:4px;letter-spacing:1px;text-transform:uppercase;font-weight:500;}
.avatar-ring{
  width:64px;height:64px;border-radius:50%;margin:0 auto 14px;
  background:linear-gradient(135deg,var(--primary-light),var(--accent));
  display:flex;align-items:center;justify-content:center;font-size:28px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}
.tricolor-rule{height:3px;width:50px;background:linear-gradient(90deg,var(--accent),var(--primary-light));border-radius:4px;margin:12px auto 0;}

.tabs{display:flex;background:rgba(255,255,255,0.06);border-radius:12px;padding:5px;margin-bottom:22px;}
.tab-btn{
  flex:1;text-align:center;padding:10px;border:none;background:none;
  border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;color:var(--text-muted);
  transition:all .2s ease;
}
.tab-btn.active{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(30,64,175,0.4);}

.form-panel{display:none;}
.form-panel.active{display:block;animation:fadeIn 0.3s ease;}
@keyframes fadeIn { from { opacity:0; transform: translateY(5px); } to { opacity:1; transform: translateY(0); } }

label{font-size:13px;font-weight:600;color:var(--text);display:block;margin:12px 0 6px;}
input{
  width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;
  font-size:14px;background:rgba(255,255,255,0.05);color:var(--text);
  transition:all 0.2s ease;
}
input::placeholder{color:var(--text-muted);}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,119,6,0.25);}

.btn{
  width:100%;margin-top:22px;padding:13px;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--primary-light),var(--primary));color:#fff;font-weight:700;font-size:14px;cursor:pointer;
  transition:all .2s ease;box-shadow:0 6px 18px rgba(30,64,175,0.35);
}
.btn:hover{transform: translateY(-1px);filter:brightness(1.1);}
.btn:active{transform: translateY(0);}

.hint{
  margin-top:16px;font-size:12px;color:var(--text-muted);
  background:rgba(217,119,6,0.1);border:1px dashed var(--accent);border-radius:8px;padding:10px;line-height:1.4;
}
.error{color:#FF8080;font-size:12px;margin-top:10px;display:none;font-weight:500;}
.back-link{display:block;text-align:center;margin-top:20px;font-size:13px;color:var(--text-muted);text-decoration:none;font-weight:600;transition:color 0.2s;}
.back-link:hover{color:#fff;}
</style>
</head>
<body>

<div class="glow-wrap">
<div class="card">
  <div class="brand">
    <div class="avatar-ring">🔐</div>
    <h1>SAHAJ JAN SEVA KENDRA</h1>
    <p>Secure Portal Login</p>
    <div class="tricolor-rule"></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="staffTabBtn" onclick="switchTab('staff')">Staff Login</button>
    <button class="tab-btn" id="customerTabBtn" onclick="switchTab('customer')">Customer Login</button>
  </div>

  <!-- STAFF LOGIN -->
  <div class="form-panel active" id="staffPanel">
    <form onsubmit="event.preventDefault(); staffLogin();">
      <label for="staffUser">Username</label>
      <input type="text" id="staffUser" placeholder="Enter username" autocomplete="username" required>
      
      <label for="staffPass">Password</label>
      <input type="password" id="staffPass" placeholder="Enter password" autocomplete="current-password" required>
      
      <button type="submit" class="btn">Login as Staff</button>
      <p class="error" id="staffError">⚠️ Galat username ya password.</p>
    </form>
    <div class="hint">🔑 Demo login — Username: <b>admin</b> &nbsp;|&nbsp; Password: <b>admin123</b></div>
  </div>

  <!-- CUSTOMER LOGIN -->
  <div class="form-panel" id="customerPanel">
    <form onsubmit="event.preventDefault(); customerLogin();">
      <label for="custMobile">Mobile Number</label>
      <input type="tel" id="custMobile" placeholder="Enter 10-digit mobile number" maxlength="10" pattern="[0-9]{10}" required>
      
      <button type="submit" class="btn">View My Requests</button>
      <p class="error" id="custError">⚠️ Kripya sahi 10-digit mobile number daalein.</p>
    </form>
    <div class="hint">📱 Apna wahi mobile number daalein jo aapne request form mein diya tha.</div>
  </div>

  <a class="back-link" href="index.html">← Back to Website</a>
</div>
</div>

<script>
// Check URL Params for initial tab
window.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  const initialTab = urlParams.get('tab');
  if(initialTab === 'customer'){ 
    switchTab('customer'); 
  }
});

function switchTab(tab){
  // Reset errors
  document.getElementById('staffError').style.display = 'none';
  document.getElementById('custError').style.display = 'none';

  // Switch panels & tabs
  document.getElementById('staffPanel').classList.toggle('active', tab==='staff');
  document.getElementById('customerPanel').classList.toggle('active', tab==='customer');
  document.getElementById('staffTabBtn').classList.toggle('active', tab==='staff');
  document.getElementById('customerTabBtn').classList.toggle('active', tab==='customer');
}

function staffLogin(){
  const user = document.getElementById('staffUser').value.trim();
  const pass = document.getElementById('staffPass').value.trim();
  const err = document.getElementById('staffError');
  
  if(user === 'admin' && pass === 'admin123'){
    sessionStorage.setItem('sjsk_role','staff');
    window.location.href = 'dashboard.html';
  } else {
    err.style.display = 'block';
  }
}

function customerLogin(){
  const mobile = document.getElementById('custMobile').value.trim();
  const err = document.getElementById('custError');
  
  if(mobile.length === 10 && /^[0-9]+$/.test(mobile)){
    sessionStorage.setItem('sjsk_role','customer');
    sessionStorage.setItem('sjsk_mobile', mobile);
    window.location.href = 'dashboard.html';
  } else {
    err.style.display = 'block';
  }
}
</script>

</body>
</html>
